<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Chat en temps réel</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script defer src="chat.js"></script>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      #messages div {
        margin: 5px 0;
        padding: 8px;
        background: #eee;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Chat NestJS</h2>
    <div id="messages"></div>
    <input id="content" placeholder="Votre message" />
    <button id="send">Envoyer</button>
  </body>
  <script>
    name=prompt('you name')
        const socket=io("http://localhost:3000")

      const div=document.createElement('div')

        socket.on('received-send',(data)=>{

  

            div.innerText= `${data.name}:${data.msg}`
                document.getElementById('messages').appendChild(div)
        })


        document.getElementById('send').addEventListener('click',()=>{
            const msg=document.getElementById('content').value
            socket.emit('send',{msg ,name})
        })



  </script>
</html>
